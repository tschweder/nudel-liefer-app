# Local development services: PostgreSQL 16 + MinIO (S3-compatible, used from NUD-006).
#
# Host ports are remapped here (5123 / 9123 / 9121) to avoid clashes with other local services.
# Only the LEFT number is the host port; the container keeps its standard port on the right.
# Matching .env values: DATABASE_URL -> localhost:5123, S3_ENDPOINT -> http://localhost:9123
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nudel
    ports:
      # Postgres listens on 5432 inside the container; the healthcheck below uses that same port.
      - "5123:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nudel"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: chainguard/minio:latest # was minio/minio:latest (removed from Docker Hub)
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Read INSIDE this container, so it must use the container's own API port (9000), not 9123.
      MC_HOST_self: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9123:9000" # host 9123 -> MinIO API on 9000
      - "9121:9001" # host 9121 -> MinIO console on 9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "self"] # was ["CMD","mc","ready","local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container: creates the bucket, then exits.
  minio-init:
    image: chainguard/minio-client:latest # was minio/mc:latest (removed from Docker Hub)
    depends_on:
      minio:
        condition: service_healthy
    # The image is distroless (no /bin/sh), so the old `entrypoint: /bin/sh -c "..."` cannot work.
    # MC_HOST_local sets the alias without a shell. Reaches the `minio` service on the Docker
    # network, so it uses the container port (9000), never the host port (9123).
    entrypoint: ["mc"]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["mb", "--ignore-existing", "local/nudel-photos"]

volumes:
  postgres-data:
  minio-data:
