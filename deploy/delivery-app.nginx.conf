# nginx snippet for the Nudel Liefer App under /delivery-app/ (NUD-127).
# Included by the HTTPS server block that serves the host (on this server: sites-enabled/ip-https,
# the same block that includes snippets/quiz-game.conf). The plain-HTTP block gets
# delivery-app-redirect.conf instead.
#
# The build carries basePath=/delivery-app, so the Node process MUST see the prefix:
#   proxy_pass http://127.0.0.1:3100;   <- no URI part (a trailing "/" would strip the prefix and
#                                          every asset 404s). Do not "fix" this to a trailing slash.
# The quiz app is different: it has no basePath and uses proxy_pass http://127.0.0.1:3000/.

# The bare prefix has no page of its own: do NOT send /delivery-app to /delivery-app/. Next answers
# /delivery-app/ with its own 308 back to /delivery-app (trailing-slash rule, which runs BEFORE the
# middleware), so the two redirects would loop forever. Send both forms to the office entry point
# instead; the app then picks the locale (cookie -> Accept-Language -> de) and lands on the login.
# (The quiz snippet can use `return 301 /quiz/` because that app has no basePath and no such rule.)
location = /delivery-app  { return 302 /delivery-app/admin; }
location = /delivery-app/ { return 302 /delivery-app/admin; }

location /delivery-app/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # React Server Components stream; buffering would delay the first byte.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Photo and screenshot uploads (the app limits a single object to 15 MiB), so nginx must not
    # reject the request first.
    client_max_body_size 20m;

    # The worker must never be served from a cache, or a deploy does not reach installed apps.
    location = /delivery-app/sw.js {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /delivery-app/offline.html {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "no-cache" always;
    }
    location = /delivery-app/offline.js {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets (Next sets its own immutable header for /_next/static; keep it explicit).
    location /delivery-app/_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# Object storage for the browser (presigned PUT/GET from the office and from the driver's phone).
#
# IMPORTANT - why this is not a path-prefixed proxy such as /delivery-app-s3/: a presigned URL is
# signed over the exact request path the SDK built from S3_ENDPOINT. With S3_ENDPOINT=https://<host>
# and a bucket-scoped location the signed path is /nudel-photos/<key>, nginx passes the path
# through unchanged and MinIO verifies the same path. A prefix-stripping proxy would hand MinIO a
# different path (or a bucket named after the prefix) and every upload would fail with
# SignatureDoesNotMatch. Keep S3_ENDPOINT=https://<host> (no path) with this location.
# Only the one bucket is exposed here; the MinIO console and every other bucket stay unreachable.
location /nudel-photos/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
    # Presigned URLs are already unguessable and expire; do not let a shared cache keep them.
    add_header Cache-Control "private, max-age=0, no-store" always;
}
